# Commands the lab's agents may run without stopping to ask.
#
# The hook that reads this is off (`enabled: false` in ../hooks.json). agy
# finds hooks.json by walking the workspace but spawns the command from the
# process directory, so the relative path in hooks.json resolves against $HOME
# and the script is not found. A hook that cannot run blocks the tool call
# rather than falling through to a prompt, so this one stopped the agent from
# writing files. Re-enabling it needs a path that does not depend on the
# working directory.
#
# Matched against the start of the command line, so `git status` covers
# `git status --short tests/`. Anything not listed here gets the normal
# permission prompt, which is the point: this is what the lab's own steps run,
# not a blanket yes.
allow:
  - pytest
  - uv run pytest
  - git status
  - git diff
  - ls
