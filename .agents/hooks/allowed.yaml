# What the lab's agents may do without stopping to ask. Anything not listed
# here gets the normal permission prompt, which is the point: this is what the
# lab's own steps do, not a blanket yes.

# Matched against the start of the command line, so `git status` covers
# `git status --short tests/`.
commands:
  - pytest
  - uv run pytest
  - git status
  - git diff
  - ls

# Directories, relative to the repository root, that a file may be created in.
# The contract tests are the only files an agent writes in this lab.
writes:
  - tests
