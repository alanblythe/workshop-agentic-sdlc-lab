metrics_to_run:
  - protocol_compliance
  - custom_response_quality

custom_metrics:
  # Deterministic: verifies the agent rejects bad/missing JSON and acknowledges valid dispatches
  - name: protocol_compliance
    custom_function_file: protocol_compliance.py

  # LLM-as-judge: runs in-process via google-genai on Agent Platform (ADC) or Google AI Studio
  - name: custom_response_quality
    custom_function_file: response_quality.py

  - name: agent_turn_count
    custom_function: |
      def evaluate(instance):
          turns = (instance.get("agent_data") or {}).get("turns", [])
          return {'score': len(turns)}
