[project]
name = "coder-runtime"
version = "0.1.0"
description = "The Antigravity SDK coding harness, isolated from the ADK serving environment."
requires-python = ">=3.12,<3.13"

# This environment exists because google-antigravity needs protobuf >= 7.35 at
# runtime, while google-adk[gcp] -- which the ADK serving surface installs --
# pins google-cloud-discoveryengine 0.13, which caps protobuf below 7.0.0. The
# two cannot share a venv, so they get one each.
#
# ADK itself is fine at protobuf 7: the cap comes from the [gcp] extra, which
# does not belong in here. Adding it reintroduces the conflict, and it
# reappears as a VersionError at import.
dependencies = [
    "google-adk[antigravity]>=2.13.0",
    # 0.1.12 declares protobuf>=4.25 but ships gencode 7.35.0, so it resolves
    # green and dies at import. 0.1.13 is the first release whose pin is true.
    "google-antigravity>=0.1.22",
    "google-cloud-secret-manager>=2.31.0",
    "protobuf>=7.36.2",
]
